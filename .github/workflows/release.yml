name: Release PicSharp-Lazy

on:
  push:
    tags:
      - 'v*'
  # Manual runs build a draft only. Publishing a version tag releases automatically.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picsharp-lazy-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'lazyq666/PicSharp-Lazy'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check version, update source, and signing setup
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing fork updater signing secret'; exit 1; }
          python3 scripts/release-metadata.py
          version=$(node -p "require('./apps/picsharp-app/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Version tag must match apps/picsharp-app/package.json'; exit 1
          fi
          if gh release view "v$version" --json isDraft --jq '.isDraft == false' | grep -q true; then
            echo 'This version is already published; increment the version before releasing'; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release gates with temporary signing keys
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          npm ci --prefix apps/picsharp-app --ignore-scripts --no-audit --no-fund
          python3 scripts/test-release.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}
      - name: Install locked JavaScript dependencies
        run: |
          npm ci --prefix packages/picsharp-sidecar --no-audit --no-fund
          npm ci --prefix apps/picsharp-app --no-audit --no-fund
      - name: Prepare bundled video and image engines
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          brew install ffmpeg
          python3 scripts/prepare-video-engine.py --source "$(brew --prefix ffmpeg)/bin" --target "$RELEASE_TARGET"
          python3 scripts/prepare-macos-sidecar.py --node "$(command -v node)"
          # Seal nested native dependencies before Tauri signs the outer app.
          find apps/picsharp-app/src-tauri/resources/sidecar -type f \( -name '*.node' -o -name '*.dylib' -o -name node \) -exec codesign --force --sign - {} \;
      - name: Build signed updater bundles and installers
        working-directory: apps/picsharp-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --ci --target ${{ matrix.target }} --bundles app --config src-tauri/tauri.macos.release.conf.json
      - name: Verify app and collect release files
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bundle="target/$RELEASE_TARGET/release/bundle"
          codesign --verify --deep --strict "$bundle/macos/PicSharp.app"
          mkdir -p "$bundle/zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/PicSharp.app" "$bundle/zip/PicSharp.zip"
          python3 scripts/collect-macos-release.py "$bundle" release-assets "$RELEASE_VERSION" "$RELEASE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Verify signatures and generate complete update manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/create-updater-manifest.py release-assets "$RELEASE_VERSION"
          python3 scripts/release-metadata.py --notes release-notes.md
      - name: Upload to a draft release
        run: |
          if ! gh release view "v$RELEASE_VERSION" --json isDraft > release-state.json; then
            gh release create "v$RELEASE_VERSION" --draft --target "$GITHUB_SHA" --title "PicSharp-Lazy v$RELEASE_VERSION" --notes-file release-notes.md
          else
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
          fi
          gh release upload "v$RELEASE_VERSION" release-assets/* --clobber
      - name: Read back uploaded files and verify again
        run: |
          gh release download "v$RELEASE_VERSION" --dir readback
          cp readback/latest.json uploaded-latest.json
          python3 scripts/create-updater-manifest.py readback "$RELEASE_VERSION"
          cmp uploaded-latest.json readback/latest.json
      - name: Publish only after both architectures pass
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: gh release edit "v$RELEASE_VERSION" --draft=false --latest
      - name: Report release
        run: |
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual runs leave a draft. Version tags publish after both Mac builds and signature readback pass.' >> "$GITHUB_STEP_SUMMARY"
